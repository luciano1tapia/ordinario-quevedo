<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Inicio</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      background-color: #f4f6f8;
    }
    /* Menú Superior */
    .menu {
      display: flex;
      width: fit-content;
      border: 2px solid #285494;
      background-color: #559be6;
    }
    .menu a {
      padding: 10px 30px;
      color: #1a1a1a;
      font-size: 18px;
      text-decoration: none;
      border-right: 2px solid #285494;
      display: inline-block;
    }
    .menu a:last-child {
      border-right: none;
    }
    .menu a.active, .menu a:hover {
      background-color: #285494;
      color: white;
    }
    /* Contenedor Azul con Bordes Redondeados */
    .contenedor {
      background-color: #72bdd9;
      border: 6px solid #1c3c63;
      border-radius: 20px;
      padding: 30px 40px;
      margin-top: 30px;
      width: fit-content;
      display: flex;
      align-items: center;
      gap: 30px;
      box-shadow: 2px 4px 8px rgba(0,0,0,0.15);
    }
    .formulario {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }
    .grupo {
      display: flex;
      align-items: center;
    }
    .grupo label {
      width: 140px; /* Ajustado para tus nombres largos */
      font-weight: bold;
      color: #0b2b4d;
      font-size: 16px;
    }
    .grupo input {
      padding: 6px;
      width: 320px;
      border: 1px solid #999;
      background-color: #fcfae8;
      font-size: 14px;
    }
    /* Botón Buscar */
    .btn-buscar {
      background-color: #f5f9eb;
      color: #1c3b8a;
      font-size: 24px;
      font-style: italic;
      border: 1px solid #a8a8a8;
      padding: 40px 30px;
      cursor: pointer;
      box-shadow: 1px 2px 4px rgba(0,0,0,0.1);
    }
  </style>
</head>
<body>

  <div class="menu">
    <a href="index.html" class="active">Inicio</a>
    <a href="conocenos.html">Conocenos</a>
    <a href="productos.html">Productos</a>
    <a href="registro.html">Registro</a>
    <a href="contacto.html">Contacto</a>
  </div>

  <div class="contenedor">
    <div class="formulario">
      <div class="grupo">
        <label>Web:</label>
        <input type="text" value="https://github.com/luciano1tapia/ordinario-quevedo" readonly>
      </div>
      <div class="grupo">
        <label>Nombre:</label>
        <input type="text" value="Juan" readonly>
      </div>
      <div class="grupo">
        <label>Apellido:</label>
        <input type="text" value="Pablo" readonly>
      </div>
    </div>
    <button class="btn-buscar">Buscar</button>
  </div>

</body>
</html>
